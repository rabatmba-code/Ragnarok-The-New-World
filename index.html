    <!-- Pre-render Language Detection (en, id, th, zh) & A/B Angle Assignment (?angle=) -->
    <script>
      (function () {
        try {
          var SUPPORTED = ['en', 'id', 'th', 'zh'];
          var params = new URLSearchParams(window.location.search);

          function normalizeLang(raw) {
            if (!raw) return null;
            var code = String(raw).toLowerCase().trim();
            if (code.indexOf('id') === 0) return 'id';
            if (code.indexOf('th') === 0) return 'th';
            if (code.indexOf('zh') === 0) return 'zh';
            if (code.indexOf('en') === 0) return 'en';
            return null;
          }

          var detected = normalizeLang(params.get('lang'));
          if (!detected) {
            try {
              detected = normalizeLang(window.localStorage.getItem('ro_lang'));
            } catch (e) {}
          }
          if (!detected) {
            var navLangs = Array.isArray(navigator.languages) && navigator.languages.length
              ? navigator.languages
              : [navigator.language || 'en'];
            for (var i = 0; i < navLangs.length; i++) {
              var match = normalizeLang(navLangs[i]);
              if (match && SUPPORTED.indexOf(match) !== -1) {
                detected = match;
                break;
              }
            }
          }
          if (!detected) detected = 'en';

          document.documentElement.lang = detected === 'zh' ? 'zh-Hans' : detected;
          document.documentElement.dataset.lang = detected;
          window.__RO_INITIAL_LANG__ = detected;

          // A/B Testing Angle (?angle=)
          var rawAngle = params.get('angle');
          var angle = rawAngle
            ? String(rawAngle).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'default'
            : 'default';
          if (rawAngle) {
            try { window.sessionStorage.setItem('ro_ab_angle', angle); } catch (e) {}
          } else {
            try {
              var savedAngle = window.sessionStorage.getItem('ro_ab_angle');
              if (savedAngle) angle = savedAngle;
            } catch (e) {}
          }
          document.documentElement.dataset.angle = angle;
          window.__RO_AB_ANGLE__ = angle;
        } catch (e) {}
      })();
    </script>

    <!-- Google Consent Mode v2 Defaults + A/B DataLayer Bootstrap -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      window.gtag = gtag;

      (function () {
        var savedConsent = null;
        try {
          savedConsent = window.localStorage.getItem('ro_consent_state');
        } catch (e) {}

        var granted = savedConsent === 'granted';
        gtag('consent', 'default', {
          ad_storage: granted ? 'granted' : 'denied',
          ad_user_data: granted ? 'granted' : 'denied',
          ad_personalization: granted ? 'granted' : 'denied',
          analytics_storage: granted ? 'granted' : 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500
        });

        window.dataLayer.push({
          event: 'ab_angle_assigned',
          ab_angle: window.__RO_AB_ANGLE__ || 'default',
          detected_lang: window.__RO_INITIAL_LANG__ || 'en'
        });

        window.__updateRoConsent = function (allowAll) {
          var status = allowAll ? 'granted' : 'denied';
          try {
            window.localStorage.setItem('ro_consent_state', status);
          } catch (e) {}
          gtag('consent', 'update', {
            ad_storage: status,
            ad_user_data: status,
            ad_personalization: status,
            analytics_storage: status
          });
          window.dataLayer.push({
            event: 'consent_preference_updated',
            consent_status: status,
            ab_angle: window.__RO_AB_ANGLE__ || 'default'
          });
        };
      })();
    </script>

    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return activeFetch;
            },
            set: function (newFetch) {
              activeFetch = newFetch;
            }
          });
        } catch (e) {}
      })();
    </script>
