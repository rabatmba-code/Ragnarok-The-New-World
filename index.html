    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            }
          });
        } catch (e) {}
      })();
    </script>
